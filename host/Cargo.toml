[package]
name = "host"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
walkdir = { version = "2.5", default-features = false }
roxmltree = { version = "0.19", default-features = false }
tokio = { version = "1.39", features = ["full", "tracing"] }
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = { version = "0.1" }
log = { version = "0.4" }
env_logger = { version = "0.11" }
futures = { version = "0.3" }
tokio-tungstenite = { version = "0.21" }
# anyhow = { version = "1" }
thiserror = { version = "1.0", default-features = false }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
quick-xml = "0.31.0"
rustls = {version = "0.23"}
tokio-rustls = "0.26"
rustls-pemfile = "2.1"
forensic-adb = "0.7"
sysinfo = "0.30"
redb = "2.1"
tls-parser = "0.11"
rcgen = {version = "0.13",features = ["pem","crypto","x509-parser"]}
time = "0.3"
rand = "0.8"
console-subscriber = "0.4"
tracing = "0.1"
tracing-subscriber = "*"
dashmap = "6.0"
base64 = "0.22"