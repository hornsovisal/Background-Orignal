[package]
name = "analysis"
version = "0.1.0"
edition = "2021"
default-run = "main"
[[bin]]
name = "result"
path = "src/result.rs"

[[bin]]
name = "intents"
path = "src/intents.rs"

[[bin]]
name = "main"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
sqlx = { version = "0.8.2", features = ["sqlite","runtime-tokio","macros","chrono"] }
prost = "0.13.3"
prost-types = "0.13.3"
uuid = "1.11"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
base64 = "0.22"
rayon = "1.10.0"
tree_magic_mini = "3"
zip = "2.2.0"
flate2 = "1.0"
zstd = "0.13"
rand = "0.8"
redb = "2.1"

[build-dependencies]
prost-build = "0.13.3"

[profile.release]
opt-level = 3 # Optimize.
lto = true    # Enable Link Time Optimization
# codegen-units = 1        # Reduce number of codegen units to increase optimizations.
panic = "abort"          # Abort on panic
debug = false            # Strip debug symbols from the binary.
rpath = false            # Do not embed the path to the dynamic library in the binary.
debug-assertions = false # Remove assertions from the binary.
incremental = false      # Disable incremental compilation.
overflow-checks = false  # Disable overflow checks.
# strip = true             # Automatically strip symbols from the binary.
