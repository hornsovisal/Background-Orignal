[versions]
agp = "8.5.1"
kotlin = "1.9.0"
xposed-api = "100"
xposed-service = "100-1.0.0"
work-runtime-ktx = "2.9.0"
reflections = "0.10.2"
okhttp = "4.9.0"
#guava="33.2.1-android"
#firebase-crashlytics-buildtools = "3.0.2"
[plugins]
agp-app = { id = "com.android.application", version.ref = "agp" }
kotlin = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

[libraries]
libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "xposed-api" }
libxposed-service = { group = "io.github.libxposed", name = "service", version.ref = "xposed-service" }
work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work-runtime-ktx" }
reflections = { group = "org.reflections", name = "reflections", version.ref = "reflections" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.9.0" }
okhttp-logging-interceptor = { module = "com.squareup.okhttp3:logging-interceptor", version = "4.9.0" }
